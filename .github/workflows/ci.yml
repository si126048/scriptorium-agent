name: Research plugin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev,build]"
      - run: ruff check scriptorium/ tests/ scripts/
      - run: python -m scriptorium doctor
      - run: pytest -q --tb=short
      - run: python scripts/verify-plugin.py
      - run: python scripts/build-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-protocol-evidence
          path: |
            output/plugin36-smoke/mcp-check.json
            output/plugin36-smoke/research-context.json
            output/scriptorium-3.6.0/
