# Local single-owner deployment without Elasticsearch.
#
#   cp .env.compose.example .env.compose          # then edit the secrets
#   docker compose -f compose.research.lite.yml --env-file .env.compose up -d --build
#   open http://127.0.0.1:8010
#
# Search falls back to scanning project materials. Add compose.research.yml instead when you
# want full-text search, or set SCRIPTORIUM_ELASTICSEARCH_URL in .env.compose.
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: scriptorium
      POSTGRES_USER: scriptorium
      POSTGRES_PASSWORD: ${SCRIPTORIUM_POSTGRES_PASSWORD:?Set a URL-safe database password}
    volumes: ["research-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptorium -d scriptorium"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: ., dockerfile: Dockerfile.research }
    command: ["scriptorium-research", "init-db"]
    environment: &research-env
      SCRIPTORIUM_DATABASE_URL: postgresql+psycopg://scriptorium:${SCRIPTORIUM_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/scriptorium
      SCRIPTORIUM_OBJECT_ROOT: /data/objects
      SCRIPTORIUM_ELASTICSEARCH_URL: ""
      SCRIPTORIUM_RESEARCH_OWNER: local-user
      SCRIPTORIUM_RESEARCH_API_KEY: ${SCRIPTORIUM_RESEARCH_API_KEY:-}
      SCRIPTORIUM_RESEARCH_ORIGINS: ${SCRIPTORIUM_RESEARCH_ORIGINS:-http://127.0.0.1:8010,http://localhost:8010}
      SCRIPTORIUM_MODEL_API_KEY: ${SCRIPTORIUM_MODEL_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LACAN_MODEL: ${LACAN_MODEL:-qwen-plus}
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["research-objects:/data/objects"]
  api:
    build: { context: ., dockerfile: Dockerfile.research }
    restart: unless-stopped
    environment: *research-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8010:8010"]
    volumes: ["research-objects:/data/objects"]
  worker:
    build: { context: ., dockerfile: Dockerfile.research }
    restart: unless-stopped
    command: ["scriptorium-research", "worker"]
    environment: *research-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: ["research-objects:/data/objects"]
volumes:
  research-pg:
  research-objects:
