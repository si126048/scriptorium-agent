[project]
name = "scriptorium"
version = "3.6.0"
description = "Evidence-grounded humanities research tools for MCP and ACP agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-MISAKA", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "mcp>=1.30,<2"]

[project.urls]
Repository = "https://github.com/si126048/scriptorium-agent"
Issues = "https://github.com/si126048/scriptorium-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.5"]
build = ["hatchling>=1.27"]
providers = ["openai>=1.0"]

[project.scripts]
scriptorium = "scriptorium.plugin.__main__:main"
scriptorium-acp = "scriptorium.plugin.acp:main"
scriptorium-mcp = "scriptorium.plugin.mcp:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scriptorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "none"
addopts = "--basetemp=.test-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
