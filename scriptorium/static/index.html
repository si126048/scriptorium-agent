<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRIPTORIUM · 对抗性话语分析终端</title>
<style>
:root {
  --paper: #f7f7f5;
  --ink: #202123;
  --panel: #ffffff;
  --panel-text: #343541;
  --gold: #5f6368;
  --orange: #a15c38;
  --cyan: #4f6f78;
  --grid: transparent;
  --border: #e5e5e2;
  --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body {
  font-family: var(--font-main);
  font-size: 15px;
  color: var(--ink);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
  padding: 12px 24px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--ink);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(32,33,35,.04);
  z-index: 10;
  flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 8px; }
.header-logo svg { width: 28px; height: 28px; }
.header-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--ink);
}
.header-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #8a8c90;
  margin-left: 4px;
}
.header-right {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: #8a8c90;
  letter-spacing: .5px;
}

/* ── MAIN LAYOUT ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 16px;
  padding: 16px;
  min-height: 0;
}

/* ── SEC-01: ANALYSIS PANEL ── */
.sec-analysis {
  flex: 1;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  background: var(--panel);
  box-shadow: 0 1px 4px rgba(32,33,35,.035);
  min-width: 0;
}
.sec-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #999b9f;
  background: #fbfbfa;
  padding: 10px 16px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.sec-label span { color: #777b80; }
.sec-label::after { content: ''; }

/* ── OUTPUT AREA ── */
.output {
  flex: 1;
  overflow-y: auto;
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}
.output::-webkit-scrollbar { width: 4px; }
.output::-webkit-scrollbar-thumb { background: #d9d9d6; border-radius: 2px; }

/* ── RESULT CARDS ── */
.card {
  position: relative;
  background: #fff;
  color: var(--panel-text);
  border: 1px solid var(--border);
  border-left: 3px solid #8d969a;
  border-radius: 8px;
  padding: 16px 18px;
  font-size: 13px;
  line-height: 1.7;
  box-shadow: 0 2px 8px rgba(32,33,35,.045);
  animation: cardIn 0.45s var(--ease-out) both;
  transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
}
.card:hover {
  box-shadow: 0 4px 16px rgba(32,33,35,.08);
  transform: translateY(-1px);
}
.card.hyp { border-left-color: #8b7b64; }
.card.cross { border-left-color: var(--orange); }
.card.synth { border-left-color: #9a9da1; }
.card-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .8px;
  color: #70757a;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-tag .dot {
  width: 6px; height: 6px;
  background: #899195;
  display: inline-block;
  border-radius: 50%;
}
.card.hyp .card-tag .dot { background: #8b7b64; }
.card.cross .card-tag .dot { background: var(--orange); }
.card-text { white-space: pre-wrap; word-break: break-word; }
.card-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #96999d;
  margin-top: 8px;
}
.card-meta .status-ok { color: var(--cyan); }
.card-meta .status-warn { color: var(--orange); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── USER MESSAGE ── */
.msg-user {
  padding: 10px 16px;
  background: #f0f1f2;
  color: var(--ink);
  border: 1px solid #e2e3e4;
  border-left: 3px solid #9a9da1;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
  animation: msgIn 0.35s var(--ease-out) both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ── PHASE PROGRESS ── */
.phase-bar {
  display: flex;
  gap: 3px;
  padding: 12px 16px;
  background: #fbfbfa;
  border: 1px solid var(--border);
  border-radius: 8px;
  animation: cardIn 0.3s var(--ease-out) both;
}
.phase-step {
  flex: 1;
  height: 3px;
  background: rgba(0,0,0,0.06);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.phase-step.active {
  background: var(--gold);
  animation: phasePulse 2s ease-in-out infinite;
}
.phase-step.done { background: var(--cyan); }
@keyframes phasePulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
.phase-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--panel-text);
  padding: 4px 16px 0;
  background: #fbfbfa;
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  display: flex;
  justify-content: space-between;
}
.phase-label span {
  opacity: 0.4;
  transition: opacity 0.4s var(--ease), color 0.4s var(--ease);
}
.phase-label span.active { opacity: 1; color: var(--gold); }
.phase-label span.done { opacity: 0.7; color: var(--cyan); }

/* ── LOADING ── */
.loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: #fbfbfa;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--panel-text);
  animation: cardIn 0.3s var(--ease-out) both;
  position: relative;
  overflow: hidden;
}
.loading::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(79,111,120,0.06), transparent);
  animation: shimmer 1.8s ease-in-out infinite;
}
@keyframes shimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}
.loading-dot {
  width: 6px; height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  animation: dotPulse 1.2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { transform: scale(0.8); opacity: 0.4; }
  50% { transform: scale(1.2); opacity: 1; }
}

/* ── INPUT AREA ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 14px 20px 16px;
  flex-shrink: 0;
  background: #fff;
}
.file-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.file-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 5px 12px;
  background: transparent;
  border: 1px solid #d7d8d6;
  border-radius: 6px;
  color: #666a6e;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: border-color 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
}
.file-btn:hover { border-color: #8e9da1; color: #40575e; }
.file-btn:active { transform: scale(0.97); }
.file-btn svg { width: 14px; height: 14px; }
.file-name {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #9a9da1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 260px;
  transition: color 0.2s;
}
.file-name.has-file { color: var(--cyan); }
.file-clear {
  font-family: var(--font-mono);
  font-size: 11px;
  background: none;
  border: 1px solid #d7d8d6;
  border-radius: 6px;
  color: #666a6e;
  cursor: pointer;
  padding: 3px 8px;
  display: none;
  transition: border-color 0.2s, color 0.2s;
}
.file-clear:hover { border-color: var(--orange); color: var(--orange); }
.file-clear.visible { display: inline; }
.input-row { display: flex; gap: 8px; margin-bottom: 8px; }
textarea {
  width: 100%;
  min-height: 78px;
  max-height: 200px;
  resize: vertical;
  border: 1px solid #d9dad8;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.2s var(--ease), box-shadow 0.25s var(--ease);
}
textarea:focus {
  border-color: #9aa5a9;
  box-shadow: 0 0 0 3px rgba(79,111,120,.10);
}
textarea::placeholder { color: #a5a7a9; }
.btn-row { display: flex; gap: 8px; }
.btn {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
  padding: 8px 20px;
  border: 1px solid #d7d8d6;
  background: transparent;
  color: #666a6e;
  border-radius: 6px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s var(--ease);
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity 0.2s;
}
.btn:hover { border-color: #8e9da1; color: #40575e; }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: #34383c;
  border-color: #34383c;
  color: #fff;
}
.btn.primary:hover { background: #202326; color: #fff; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* ── SEC-02: SIDEBAR ── */
.sec-sidebar {
  width: 356px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  background: var(--panel);
  box-shadow: 0 1px 4px rgba(32,33,35,.035);
}
.tab-bar {
  display: flex;
  background: #fbfbfa;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.tab {
  flex: 1;
  padding: 12px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  border: none;
  background: transparent;
  color: #898c90;
  border-bottom: 2px solid transparent;
  transition: color 0.25s var(--ease), border-color 0.25s var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.tab:hover { color: var(--panel-text); }
.tab.active {
  color: #34383c;
  border-bottom-color: #687d83;
}
.tab svg { width: 14px; height: 14px; }
.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.tab-content::-webkit-scrollbar { width: 3px; }
.tab-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
.tab-panel { display: none; animation: panelIn 0.3s var(--ease-out); }
.tab-panel.active { display: block; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── PERSPECTIVE CARDS ── */
.persp-card {
  position: relative;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
}
.persp-card:hover {
  box-shadow: 0 4px 12px rgba(32,33,35,.06);
  transform: translateY(-1px);
}
.persp-card.lacan { border-left: 2px solid var(--cyan); }
.persp-card.deleuze { border-left: 2px solid var(--orange); }
.persp-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
  color: #34383c;
  margin-bottom: 4px;
}
.persp-symbol {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold);
  margin-left: 6px;
}
.persp-concepts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 8px 0;
}
.concept-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  background: #f1f2f1;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: #6e7275;
}
.persp-blind {
  font-size: 11px;
  color: rgba(0,0,0,0.45);
  margin-top: 6px;
}
.persp-blind::before { content: '! '; color: var(--orange); font-weight: 600; }

/* ── DOCUMENT PANEL ── */
.drop-zone {
  border: 1px dashed #d4d6d4;
  border-radius: 8px;
  padding: 30px 22px;
  text-align: center;
  margin-bottom: 12px;
  background: #fbfbfa;
  transition: all 0.25s var(--ease);
  cursor: pointer;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: #8e9da1;
  box-shadow: inset 0 0 0 1px #8e9da1;
  background: #f5f7f7;
}
.drop-zone svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: 0.4; }
.drop-zone-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(0,0,0,0.4);
}
.drop-zone-hint {
  font-size: 10px;
  color: rgba(0,0,0,0.25);
  margin-top: 4px;
}
.doc-list { display: flex; flex-direction: column; gap: 6px; }
.doc-item {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  animation: cardIn 0.35s var(--ease-out) both;
}
.doc-id { color: var(--gold); }
.doc-type { color: rgba(0,0,0,0.35); font-size: 10px; }

/* ── SEARCH PANEL ── */
.search-input-row { display: flex; gap: 6px; margin-bottom: 12px; }
.search-input {
  flex: 1;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--panel-text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus { border-color: #9aa5a9; box-shadow: 0 0 0 3px rgba(79,111,120,.08); }
.search-input::placeholder { color: rgba(0,0,0,0.2); }
.search-btn {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--panel-text);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: all 0.2s;
}
.search-btn:hover { border-color: #8e9da1; color: #40575e; }
.search-btn svg { width: 16px; height: 16px; }
.search-result {
  padding: 8px 10px;
  border-left: 2px solid rgba(0,0,0,0.08);
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.6;
  border-radius: 0 6px 6px 0;
  animation: cardIn 0.3s var(--ease-out) both;
}
.search-result-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold);
  margin-bottom: 2px;
}
.search-result mark {
  background: rgba(79,111,120,0.12);
  color: var(--cyan);
  padding: 0 2px;
  border-radius: 2px;
}
.no-data {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(0,0,0,0.25);
  text-align: center;
  padding: 24px;
}
.no-data::after {
  content: '|';
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── FOOTER / TELEMETRY ── */
.footer {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 7px 20px;
  border-top: 1px solid var(--border);
  background: #fff;
  font-family: var(--font-mono);
  font-size: 10px;
  color: #8d9093;
  flex-shrink: 0;
}
.footer-item { display: flex; align-items: center; gap: 4px; }
.footer-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  display: inline-block;
  transition: background 0.3s;
}
.footer-dot.ok { background: var(--cyan); }
.footer-dot.warn { background: var(--gold); }
.footer-dot.err { background: var(--orange); }
.footer-sep { color: #d0d1cf; }

/* ── ERROR CARD ── */
.card.error {
  border-left-color: var(--orange);
  background: rgba(161,92,56,0.04);
  color: var(--orange);
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .main { flex-direction: column; padding: 0; gap: 0; }
  .sec-analysis { border: none; border-bottom: 1px solid var(--border); box-shadow: none; }
  .sec-sidebar { width: 100%; max-height: 40vh; border: none; box-shadow: none; }
  .input-area { padding: 14px; }
}

/* ── EMPTY STATE ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  opacity: 0.3;
  position: relative;
  min-height: 300px;
}
.empty-state::before {
  content: 'SCRIPTORIUM / READY';
  position: absolute;
  top: 22px; left: 0;
  color: rgba(0,0,0,0.15);
  font: 10px var(--font-mono);
  letter-spacing: 2px;
}
.empty-state svg { width: 68px; height: 68px; opacity: .42; }
.empty-state-text {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1px;
  color: #72757a;
}

/* ── SECTION TITLE IN OUTPUT ── */
.section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #92959a;
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-top: 8px;
  animation: cardIn 0.3s var(--ease-out) both;
}

/* ── CONVERSATION MODE ── */
.conversation-mode { display:flex; gap:4px; margin-bottom:8px; }
.conversation-mode button {
  border:1px solid #dfe0de;
  background:transparent;
  color: #7b7e82;
  padding:5px 10px;
  font:10px var(--font-mono);
  cursor:pointer;
  border-radius: 6px;
  transition: all 0.2s var(--ease);
}
.conversation-mode button.active {
  border-color: #8e9da1;
  color: #40575e;
  background: #f1f4f4;
}
.conversation-mode button:disabled { opacity:.45; cursor:default; }

/* ── INTERVIEW ── */
.interview-intro { padding: 10px 2px 14px; border-bottom: 1px solid var(--border); }
.interview-kicker { color: var(--cyan); font: 9px var(--font-mono); letter-spacing: 1.5px; }
.interview-title { color: var(--ink); font-size: 18px; font-weight: 600; margin-top: 7px; }
.interview-copy { color: #777b80; font-size: 11px; line-height: 1.55; margin-top: 4px; }
.interview-status { margin: 12px 0 8px; color: var(--cyan); font: 10px var(--font-mono); letter-spacing: .5px; }
.interview-progress { color: rgba(0,0,0,0.4); font: 10px var(--font-mono); margin-bottom: 10px; }
.interview-question {
  min-height: 92px; padding: 13px;
  border: 1px solid var(--border); border-left: 3px solid #8e9da1;
  background: #fbfbfa; border-radius: 8px;
  color: var(--ink); font-size: 13px; line-height: 1.65;
}
.interview-module { display:flex; justify-content:space-between; gap:12px; color:#66777c; font:10px var(--font-mono); letter-spacing:.8px; margin-bottom:8px; text-transform:uppercase; }
.interview-context { margin: 0 0 10px; padding: 7px 9px; border-left: 2px solid #aebbbe; color: #777b80; font-size: 10px; line-height:1.5; border-radius: 0 4px 4px 0; }
.interview-modules { display:flex; gap:4px; margin:8px 0 12px; flex-wrap:wrap; }
.interview-module-step { padding:4px 7px; border:1px solid #e0e1df; color:#9a9da1; font:9px var(--font-mono); border-radius: 4px; transition: all 0.25s var(--ease); }
.interview-module-step.active { border-color:var(--cyan); color:var(--cyan); background:rgba(79,111,120,.06); }
.interview-module-step.done { color:#767b7e; border-color:#c6cccd; }
.interview-message { border-left-color: #8e9da1; background: #f7f9f9; }
.interview-question .question-kind { display: block; color: var(--gold); font: 9px var(--font-mono); letter-spacing: 1px; margin-bottom: 7px; }
.interview-answer { min-height: 86px; max-height: 160px; margin-top: 10px; font-size: 12px; }
.interview-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.interview-actions.secondary { align-items: center; justify-content: flex-start; }
.interview-actions .btn { padding: 7px 10px; font-size: 11px; }
.interview-actions .file-btn, .interview-actions .file-clear { font: 10px var(--font-mono); padding: 4px 0; }
.interview-timeline { margin-top: 16px; border-top: 1px solid var(--border); }
.interview-turn { padding: 9px 0; border-bottom: 1px solid var(--border); color: #777b80; font-size: 11px; line-height: 1.55; }
.interview-turn strong { display: block; color: #66777c; font: 9px var(--font-mono); margin-bottom: 3px; }

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="28" height="28" rx="0" stroke="var(--ink)" stroke-width="1.5" fill="none"/>
      <rect x="8" y="2" width="16" height="10" rx="0" stroke="var(--ink)" stroke-width="1" fill="var(--paper)"/>
      <rect x="12" y="4" width="8" height="5" rx="0" fill="var(--ink)"/>
      <rect x="6" y="16" width="20" height="12" rx="0" fill="var(--ink)" opacity="0.08"/>
      <rect x="18" y="18" width="6" height="3" rx="0" fill="var(--gold)"/>
    </svg>
    <span class="header-title">Scriptorium</span>
    <span class="header-sub">v2.2</span>
  </div>
  <span class="header-sub" style="margin-left:8px">对抗性话语分析终端</span>
  <span class="header-right">LACAN x DELEUZE</span>
</header>

<!-- MAIN -->
<div class="main">
  <!-- SEC-01: ANALYSIS -->
  <section class="sec-analysis">
    <div class="sec-label"><span>SEC-01</span> · 分析终端</div>
    <div class="output" id="output">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="36" height="36" stroke="var(--ink)" stroke-width="1" fill="none"/>
          <rect x="12" y="6" width="24" height="14" stroke="var(--ink)" stroke-width="0.8" fill="none"/>
          <rect x="17" y="9" width="14" height="7" fill="var(--ink)" opacity="0.1"/>
          <rect x="10" y="24" width="28" height="14" stroke="var(--ink)" stroke-width="0.5" fill="none" stroke-dasharray="2 2"/>
          <rect x="26" y="27" width="8" height="4" fill="var(--gold)" opacity="0.4"/>
        </svg>
        <span class="empty-state-text">输入文本以启动分析</span>
      </div>
    </div>
    <div class="input-area">
      <div class="conversation-mode" aria-label="对话模式">
        <button id="mode-analysis" class="active" onclick="setConversationMode('analysis')">分析</button>
        <button id="mode-interview" onclick="setConversationMode('interview')">访谈</button>
      </div>
      <div class="file-row">
        <button class="file-btn" id="file-pick-btn">
          <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="1" width="8" height="4" stroke="currentColor" stroke-width="0.8" fill="none"/><rect x="5.5" y="2" width="5" height="2" fill="currentColor" opacity="0.2"/><rect x="8" y="8" width="4" height="2" fill="currentColor" opacity="0.4"/></svg>
          附加文件
        </button>
        <span class="file-name" id="file-name-display">未选择文件</span>
        <button class="file-clear" id="file-clear-btn">移除</button>
        <input type="file" id="analysis-file-input" accept=".txt,.md,.pdf" style="display:none">
      </div>
      <textarea id="input-text" placeholder="在此输入待分析文本...&#10;支持中文、英文、法文等多语言文本&#10;或通过上方按钮附加 .txt / .md / .pdf 文件" onkeydown="if(event.key==='Enter' && (event.ctrlKey || event.metaKey)){event.preventDefault();handleMainSend()}"></textarea>
      <div class="btn-row">
        <button class="btn primary" id="btn-analyze" onclick="handleMainSend()">分析</button>
        <button class="btn" id="btn-dialectical" onclick="runDialectical()">辩证分析</button>
      </div>
    </div>
  </section>

  <!-- SEC-02: SIDEBAR -->
  <aside class="sec-sidebar">
    <div class="sec-label"><span>SEC-02</span> · 数据面板</div>
    <div class="tab-bar">
      <button class="tab active" data-tab="perspectives" onclick="switchTab('perspectives')">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" stroke="currentColor" stroke-width="1" fill="none"/><rect x="4" y="3" width="8" height="4" stroke="currentColor" stroke-width="0.6" fill="none"/><rect x="9" y="5" width="3" height="1.5" fill="currentColor" opacity="0.4"/></svg>
        视角
      </button>
      <button class="tab" data-tab="documents" onclick="switchTab('documents')">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" stroke="currentColor" stroke-width="1" fill="none"/><line x1="4" y1="5" x2="12" y2="5" stroke="currentColor" stroke-width="0.6"/><line x1="4" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="0.6"/><line x1="4" y1="11" x2="9" y2="11" stroke="currentColor" stroke-width="0.6"/></svg>
        文档
      </button>
      <button class="tab" data-tab="search" onclick="switchTab('search')">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1" fill="none"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1"/></svg>
        搜索
      </button>
      <button class="tab" data-tab="interview" onclick="switchTab('interview')">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 3h12v8H6l-4 3V3Z" stroke="currentColor" stroke-width="1" fill="none"/><path d="M5 6h6M5 8.5h4" stroke="currentColor" stroke-width=".8"/></svg>
        访谈
      </button>
    </div>
    <div class="tab-content">
      <!-- PERSPECTIVES -->
      <div class="tab-panel active" id="panel-perspectives">
        <div class="no-data" id="persp-loading">LOADING...</div>
      </div>
      <!-- DOCUMENTS -->
      <div class="tab-panel" id="panel-documents">
        <div class="drop-zone" id="drop-zone">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="4" width="32" height="40" stroke="var(--panel-text)" stroke-width="1.5" fill="none"/>
            <rect x="14" y="4" width="20" height="12" stroke="var(--panel-text)" stroke-width="1" fill="none"/>
            <rect x="18" y="7" width="12" height="6" fill="var(--panel-text)" opacity="0.15"/>
            <rect x="24" y="22" width="10" height="5" fill="var(--gold)" opacity="0.5"/>
            <line x1="14" y1="24" x2="34" y2="24" stroke="var(--panel-text)" stroke-width="0.5" stroke-dasharray="2 2"/>
          </svg>
          <div class="drop-zone-text">拖拽文件至此 或 点击上传</div>
          <div class="drop-zone-hint">.txt .md .pdf / max 10MB</div>
          <input type="file" id="file-input" accept=".txt,.md,.pdf" style="display:none">
        </div>
        <div class="doc-list" id="doc-list"></div>
      </div>
      <!-- SEARCH -->
      <div class="tab-panel" id="panel-search">
        <div class="search-input-row">
          <input class="search-input" id="search-input" placeholder="检索理论语料..." onkeydown="if(event.key==='Enter')runSearch()">
          <button class="search-btn" onclick="runSearch()">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4" stroke="currentColor" stroke-width="1" fill="none"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
        <div id="search-results">
          <div class="no-data">输入关键词检索</div>
        </div>
      </div>
      <!-- INTERVIEW -->
      <div class="tab-panel" id="panel-interview">
        <div class="interview-intro">
          <div class="interview-kicker">INTERVIEW / FIELD SESSION</div>
          <div class="interview-title">把经验说出来</div>
          <div class="interview-copy">固定主问题保证连续性，必要时由模型提出一条澄清追问。</div>
        </div>
        <div class="interview-status" id="interview-status">尚未开始访谈</div>
        <div class="interview-progress" id="interview-progress"></div>
        <div class="interview-modules" id="interview-modules"></div>
        <div class="interview-question" id="interview-question">
          <div class="no-data">点击下方按钮创建访谈会话</div>
        </div>
        <div class="interview-actions">
          <button class="btn primary" id="interview-start" onclick="startInterview()">开始访谈</button>
          <button class="btn" onclick="focusConversationInput()">进入主对话回答</button>
        </div>
        <div class="interview-actions secondary">
          <button class="file-btn" id="interview-pause" onclick="pauseInterview()" disabled>暂停</button>
          <button class="file-btn" id="interview-resume" onclick="resumeInterview()" disabled>继续</button>
          <button class="file-btn" id="interview-complete" onclick="completeInterview()" disabled>完成并分析</button>
          <button class="file-btn" id="interview-reset" onclick="resetInterview()" disabled>重新开始</button>
          <button class="file-clear" id="interview-withdraw" onclick="withdrawInterview()" disabled>撤回</button>
        </div>
        <div class="interview-timeline" id="interview-timeline"></div>
      </div>
    </div>
  </aside>
</div>

<!-- FOOTER / TELEMETRY -->
<footer class="footer">
  <div class="footer-item"><span class="footer-dot ok" id="sys-dot"></span> SYS:<span id="sys-status">OK</span></div>
  <span class="footer-sep">|</span>
  <div class="footer-item"><span class="footer-dot ok" id="db-dot"></span> DB</div>
  <span class="footer-sep">|</span>
  <div class="footer-item">MODEL:<span id="model-name">--</span></div>
  <span class="footer-sep">|</span>
  <div class="footer-item">T:<span id="temp-val">0.3</span></div>
  <span class="footer-sep">|</span>
  <div class="footer-item">
    <svg viewBox="0 0 16 16" fill="none" style="width:12px;height:12px"><rect x="2" y="2" width="12" height="12" stroke="currentColor" stroke-width="0.8" fill="none"/><rect x="5" y="2" width="6" height="5" stroke="currentColor" stroke-width="0.5" fill="none"/><rect x="10" y="9" width="3" height="2" fill="var(--gold)" opacity="0.5"/></svg>
    LOCAL
  </div>
  <span class="footer-sep">|</span>
  <div class="footer-item" style="cursor:pointer" onclick="var i=document.getElementById('api-key-input');i.style.display=i.style.display==='none'?'inline-block':'none';i.focus()">
    <span class="footer-dot" id="auth-dot" style="background:rgba(200,201,184,0.3)"></span>
    KEY
    <input id="api-key-input" type="password" placeholder="paste key..." style="
      display:none; width:100px; background:transparent; border:none; border-bottom:1px solid var(--gold);
      color:var(--panel-text); font:inherit; font-size:10px; padding:0 4px; outline:none; margin-left:4px;
    " onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter'){setApiKey(this.value);this.style.display='none';updateAuthDot()}">
  </div>
</footer>

<script>
const API = window.location.protocol === 'file:'
  ? (localStorage.getItem('scriptorium_api_base') || 'http://127.0.0.1:8000')
  : '';
const output = document.getElementById('output');
const emptyState = document.getElementById('empty-state');
const inputText = document.getElementById('input-text');
let projectId = 'web-session';
let participantId = 'web-user';
let runCounter = 0;
let initialized = false;
let selectedFile = null;
let interviewSessionId = localStorage.getItem('scriptorium_interview_session') || '';
let conversationMode = localStorage.getItem('scriptorium_conversation_mode') || 'analysis';
let interviewSession = null;
let conversationMessages = JSON.parse(localStorage.getItem('scriptorium_conversation_messages') || '[]');

function getApiKey() { return localStorage.getItem('lacan_api_key') || ''; }
function setApiKey(key) { localStorage.setItem('lacan_api_key', key); }
function authHeaders() {
  const k = getApiKey();
  return k ? {'Authorization': 'Bearer ' + k} : {};
}
function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers || {}, authHeaders());
  return fetch(url, options);
}
function updateAuthDot() {
  const dot = document.getElementById('auth-dot');
  if (!dot) return;
  dot.style.background = getApiKey() ? 'var(--cyan)' : 'rgba(200,201,184,0.3)';
}

const filePickBtn = document.getElementById('file-pick-btn');
const analysisFileInput = document.getElementById('analysis-file-input');
const fileNameDisplay = document.getElementById('file-name-display');
const fileClearBtn = document.getElementById('file-clear-btn');

filePickBtn.addEventListener('click', () => analysisFileInput.click());
analysisFileInput.addEventListener('change', () => {
  if (analysisFileInput.files.length) {
    selectedFile = analysisFileInput.files[0];
    fileNameDisplay.textContent = selectedFile.name;
    fileNameDisplay.classList.add('has-file');
    fileClearBtn.classList.add('visible');
  }
});
fileClearBtn.addEventListener('click', () => {
  selectedFile = null;
  analysisFileInput.value = '';
  fileNameDisplay.textContent = '未选择文件';
  fileNameDisplay.classList.remove('has-file');
  fileClearBtn.classList.remove('visible');
});

function getAnalysisFile() {
  if (selectedFile) return selectedFile;
  const text = inputText.value.trim();
  if (!text) return null;
  return new Blob([text], {type: 'text/plain'});
}
function getAnalysisFileName() {
  if (selectedFile) return selectedFile.name;
  return 'input.txt';
}

function setConversationMode(mode) {
  conversationMode = mode === 'interview' ? 'interview' : 'analysis';
  localStorage.setItem('scriptorium_conversation_mode', conversationMode);
  document.getElementById('mode-analysis')?.classList.toggle('active', conversationMode === 'analysis');
  document.getElementById('mode-interview')?.classList.toggle('active', conversationMode === 'interview');
  const fileRow = document.querySelector('.input-area .file-row');
  if (fileRow) fileRow.style.display = conversationMode === 'analysis' ? '' : 'none';
  const input = document.getElementById('input-text');
  if (input) input.placeholder = conversationMode === 'interview'
    ? '输入对当前问题的回答... (Ctrl/Command + Enter 发送)'
    : '在此输入待分析文本...\n支持中文、英文、法文等多语言文本\n或通过上方按钮附加 .txt / .md / .pdf 文件';
  const send = document.getElementById('btn-analyze');
  if (send) send.textContent = conversationMode === 'interview' ? '发送回答' : '分析';
  const dialectical = document.getElementById('btn-dialectical');
  if (dialectical) dialectical.disabled = conversationMode === 'interview';
  if (mode === 'interview') {
    switchTab('interview');
  }
}
function focusConversationInput() {
  setConversationMode('interview');
  document.getElementById('input-text')?.focus();
}
async function handleMainSend() {
  if (conversationMode === 'interview') {
    if (!interviewSessionId || !interviewSession?.current_question) {
      await startInterview();
      return;
    }
    await submitInterviewAnswer();
    return;
  }
  await runAnalyze();
}

// ── INIT ──
async function init() {
  try {
    const r = await apiFetch(`${API}/health`);
    if (r.ok) {
      document.getElementById('sys-dot').className = 'footer-dot ok';
      document.getElementById('sys-status').textContent = 'OK';
    }
  } catch {
    document.getElementById('sys-dot').className = 'footer-dot err';
    document.getElementById('sys-status').textContent = 'ERR';
  }
  try {
    await apiFetch(`${API}/api/v1/projects`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: projectId})
    });
    await apiFetch(`${API}/api/v1/participants`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: participantId, project_id: projectId})
    });
    initialized = true;
  } catch {}
  loadPerspectives();
  updateAuthDot();
  restoreConversation();
  setConversationMode(conversationMode);
  if (interviewSessionId) restoreInterview();
}

// ── TAB SWITCHING ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

// ── PERSPECTIVES ──
async function loadPerspectives() {
  const panel = document.getElementById('panel-perspectives');
  try {
    const r = await apiFetch(`${API}/api/v1/perspectives`);
    if (!r.ok) {
      let detail = `HTTP ${r.status}`;
      try { const body = await r.json(); detail = body.detail || body.error?.message || detail; } catch {}
      throw new Error(detail);
    }
    const data = await r.json();
    const perspectives = data.perspectives || [];
    panel.innerHTML = '';
    perspectives.forEach((p, idx) => {
      const cls = p.id === 'lacan' ? 'lacan' : p.id === 'deleuze' ? 'deleuze' : '';
      const symbol = p.id === 'lacan' ? '[$]' : p.id === 'deleuze' ? '[Ag]' : '[?]';
      const card = document.createElement('div');
      card.className = `persp-card ${cls}`;
      card.style.animationDelay = `${idx * 60}ms`;
      card.innerHTML = `
        <div class="persp-name">${p.name || p.id}<span class="persp-symbol">${symbol}</span></div>
        <div class="persp-concepts">${(p.concepts||[]).map(c => `<span class="concept-tag">${c}</span>`).join('')}</div>
        ${(p.blind_spots||[]).map(b => `<div class="persp-blind">${b}</div>`).join('')}
      `;
      panel.appendChild(card);
    });
    if (!perspectives.length) panel.innerHTML = '<div class="no-data">NO PERSPECTIVES</div>';
  } catch (e) {
    const hint = API
      ? `无法连接 API (${API})。请先运行 uvicorn scriptorium.api:app --host 127.0.0.1 --port 8000。`
      : `视角库加载失败: ${e.message || '请求错误'}`;
    panel.innerHTML = `<div class="no-data">${escHtml(hint)}</div>`;
  }
}

// ── ANALYZE ──
async function runAnalyze() {
  const file = getAnalysisFile();
  if (!file) return;
  const displayName = selectedFile ? `[${selectedFile.name}]` : '';
  const text = selectedFile ? selectedFile.name : inputText.value.trim();
  clearEmpty();
  setBusy(true);
  addUserMsg(displayName ? displayName : text);
  showLoading('ANALYZING...');
  try {
    const iid = `run-${Date.now()}-${crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)}`;
    const form = new FormData();
    form.append('project_id', projectId);
    form.append('file', file, getAnalysisFileName());
    const uploadRes = await apiFetch(`${API}/api/v1/participants/${participantId}/sources`, {method: 'POST', body: form});
    if (!uploadRes.ok) { removeLoading(); addCard('error', 'ERR', await apiErrorText(uploadRes, '上传失败'), ''); setBusy(false); return; }
    const uploadData = await uploadRes.json();
    const sid = uploadData.id;
    const rr = await apiFetch(`${API}/api/v1/analysis-runs`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_id: projectId, participant_id: participantId, source_ids: [sid], idempotency_key: iid})
    });
    if (!rr.ok) { removeLoading(); addCard('error', 'ERR', await apiErrorText(rr, '分析启动失败'), ''); setBusy(false); return; }
    const run = await rr.json();
    const rid = run.run_id;
    let tries = 0;
    while (tries++ < 60) {
      await sleep(1500);
      const sr = await apiFetch(`${API}/api/v1/analysis-runs/${rid}`);
      const rd = await sr.json();
      if (rd.state === 'APPROVED' || rd.state === 'COMPILED') {
        const pr = await apiFetch(`${API}/api/v1/analysis-runs/${rid}/packet`);
        const packet = await pr.json();
        removeLoading();
        renderPacket(packet);
        break;
      }
      if (rd.state === 'FAILED' || rd.state === 'NEEDS_HUMAN_REVIEW') {
        removeLoading();
        if (rd.state === 'NEEDS_HUMAN_REVIEW') {
          const pr2 = await apiFetch(`${API}/api/v1/analysis-runs/${rid}/packet`);
          const pkt = await pr2.json();
          renderPacket(pkt);
        } else {
          addCard('error', 'ERR', '分析失败: ' + (rd.errors||[]).map(e=>e.message||e).join('; '), '');
        }
        break;
      }
    }
  } catch (e) {
    removeLoading();
    addCard('error', 'ERR', e.message, '');
  }
  setBusy(false);
}

// ── DIALECTICAL ──
async function runDialectical() {
  const file = getAnalysisFile();
  if (!file) return;
  const displayName = selectedFile ? `[${selectedFile.name}]` : '';
  const text = selectedFile ? selectedFile.name : inputText.value.trim();
  clearEmpty();
  setBusy(true);
  addUserMsg(displayName ? `>> ${displayName}` : text);
  showPhaseBar();
  try {
    const iid = `dial-${Date.now()}-${crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)}`;
    const form = new FormData();
    form.append('project_id', projectId);
    form.append('file', file, getAnalysisFileName());
    const uploadRes = await apiFetch(`${API}/api/v1/participants/${participantId}/sources`, {method: 'POST', body: form});
    if (!uploadRes.ok) { removePhaseBar(); addCard('error', 'ERR', await apiErrorText(uploadRes, '上传失败'), ''); setBusy(false); return; }
    const uploadData = await uploadRes.json();
    const sid = uploadData.id;
    const rr = await apiFetch(`${API}/api/v1/dialectical/run`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_id: projectId,
        participant_id: participantId,
        source_ids: [sid],
        perspective_ids: ['lacan', 'deleuze'],
        idempotency_key: iid,
        generate_report: true
      })
    });
    if (!rr.ok) { removePhaseBar(); addCard('error', 'ERR', await apiErrorText(rr, '辩证分析请求失败'), ''); setBusy(false); return; }
    const result = await rr.json();
    removePhaseBar();
    renderDialectical(result);
  } catch (e) {
    removePhaseBar();
    addCard('error', 'ERR', e.message, '');
  }
  setBusy(false);
}

// ── RENDER PACKET ──
function renderPacket(packet) {
  const obs = packet.observations || [];
  const hyps = packet.hypotheses || [];
  if (obs.length) addSectionTitle('OBSERVATIONS');
  obs.forEach((o, i) => {
    const reg = (o.register_markers||[]).join(' ') || o.rsi_register || '';
    addCard('obs', `OBS-${String(i+1).padStart(3,'0')}`, o.label || '', reg);
  });
  if (hyps.length) addSectionTitle('HYPOTHESES');
  hyps.forEach((h, i) => {
    const st = h.status || 'provisional';
    const meta = `status: ${st}`;
    const concepts = (h.concept_ids||[]).join(', ');
    const extra = concepts ? `concepts: ${concepts}` : '';
    addCard('hyp', `HYP-${String(i+1).padStart(3,'0')}`, h.id || '', meta, extra);
  });
}

// ── RENDER DIALECTICAL ──
function renderDialectical(result) {
  const p1 = result.phase1_analyses || [];
  const p2 = result.phase2_cross_critiques || [];
  const p3 = result.phase3_synthesis;
  const p4 = result.phase4_report;

  if (p1.length) addSectionTitle('PHASE 1 / 独立分析');
  p1.forEach(a => {
    const pid = a.perspective_id || '?';
    const sym = pid === 'lacan' ? '[$]' : '[Ag]';
    (a.observations||[]).forEach((o, i) => {
      addCard('obs', `${pid} OBS-${i+1}`, o.label || '', sym);
    });
    (a.hypotheses||[]).forEach((h, i) => {
      addCard('hyp', `${pid} HYP-${i+1}`, h.id || '', sym);
    });
  });

  if (p2.length) addSectionTitle('PHASE 2 / 交叉批判');
  p2.forEach(c => {
    const from = c.source_perspective_id || '?';
    const to = c.target_perspective_id || '?';
    (c.counterexamples||[]).forEach((x, i) => {
      addCard('cross', `${from}->${to} CEX-${i+1}`, typeof x === 'string' ? x : (x.text || JSON.stringify(x)), '');
    });
    (c.blind_spot_alerts||[]).forEach((b, i) => {
      addCard('cross', `${from}->${to} BLIND-${i+1}`, typeof b === 'string' ? b : JSON.stringify(b), '! BLIND SPOT');
    });
    (c.epistemic_gaps||[]).forEach((g, i) => {
      addCard('cross', `${from}->${to} GAP-${i+1}`, typeof g === 'string' ? g : JSON.stringify(g), '');
    });
  });

  if (p3) {
    addSectionTitle('PHASE 3 / 综合');
    (p3.convergence||[]).forEach((c, i) => {
      addCard('synth', `CONV-${i+1}`, typeof c === 'string' ? c : JSON.stringify(c), '收敛');
    });
    (p3.divergence||[]).forEach((d, i) => {
      addCard('synth', `DIV-${i+1}`, typeof d === 'string' ? d : JSON.stringify(d), '发散');
    });
    (p3.unique_insights||[]).forEach((u, i) => {
      addCard('synth', `INS-${i+1}`, typeof u === 'string' ? u : JSON.stringify(u), '洞见');
    });
  }

  if (p4) {
    addSectionTitle('PHASE 4 / 报告');
    addCard('synth', 'REPORT', p4, 'FINAL');
  }
}

// ── SEARCH ──
async function runSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const results = document.getElementById('search-results');
  results.innerHTML = '<div class="no-data">SEARCHING...</div>';
  try {
    const r = await apiFetch(`${API}/api/v1/theory/search?project_id=${projectId}&q=${encodeURIComponent(q)}&limit=5`);
    const data = await r.json();
    const items = data.items || [];
    if (!items.length) {
      results.innerHTML = '<div class="no-data">NO DATA FOUND</div>';
      return;
    }
    results.innerHTML = '';
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-result';
      const text = item.excerpt || item.text || item.snippet || '';
      const highlighted = text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
      div.innerHTML = `<div class="search-result-id">${item.id || item.doc_id || '?'}</div><div>${highlighted}</div>`;
      results.appendChild(div);
    });
  } catch {
    results.innerHTML = '<div class="no-data">FETCH ERROR</div>';
  }
}

// ── FILE UPLOAD ──
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

async function uploadFile(file) {
  const form = new FormData();
  form.append('project_id', projectId);
  form.append('file', file);
  try {
    const r = await apiFetch(`${API}/api/v1/theory/sources`, {method: 'POST', body: form});
    if (r.ok) {
      const data = await r.json();
      addDocItem(data.id || file.name, file.type || 'unknown');
      dropZone.querySelector('.drop-zone-text').textContent = '写入完成';
      setTimeout(() => { dropZone.querySelector('.drop-zone-text').textContent = '拖拽文件至此 或 点击上传'; }, 2000);
    }
  } catch {}
}

function addDocItem(id, type) {
  const list = document.getElementById('doc-list');
  const div = document.createElement('div');
  div.className = 'doc-item';
  div.innerHTML = `<span class="doc-id">${id}</span><span class="doc-type">${type}</span>`;
  list.prepend(div);
}

// ── DOM HELPERS ──
function clearEmpty() { if (emptyState) emptyState.remove(); }

function persistConversation() {
  localStorage.setItem('scriptorium_conversation_messages', JSON.stringify(conversationMessages.slice(-100)));
}
function appendStoredMessage(message) {
  const div = document.createElement('div');
  if (message.type === 'user') {
    div.className = 'msg-user';
    div.textContent = message.text;
  } else if (message.type === 'section') {
    div.className = 'section-title';
    div.textContent = message.text;
  } else {
    div.className = `card ${message.kind === 'obs' ? '' : (message.kind || '')}`;
    if (message.scope) div.dataset.conversationScope = message.scope;
    div.innerHTML = `<div class="card-tag"><span class="dot"></span>${escHtml(message.tag || '')}</div><div class="card-text">${escHtml(message.text || '')}</div>${message.meta ? `<div class="card-meta">${escHtml(message.meta)}</div>` : ''}`;
  }
  output.appendChild(div);
}
function restoreConversation() {
  if (!conversationMessages.length) return;
  clearEmpty();
  conversationMessages.forEach(appendStoredMessage);
  scrollOutput();
}
function clearInterviewMessages() {
  conversationMessages = conversationMessages.filter(item => item.scope !== 'interview');
  persistConversation();
  output.querySelectorAll('[data-conversation-scope="interview"]').forEach(el => el.remove());
}
function addInterviewQuestionMessage(question) {
  if (!question) return;
  const label = question.kind === 'followup' ? 'FOLLOW-UP / 澄清追问' : 'PRIMARY / 主问题';
  const text = question.text || '';
  const meta = `${question.module_title || '访谈'}${question.context_hint ? ' / ' + question.context_hint : ''}`;
  conversationMessages.push({type:'card', kind:'interview-message', tag:label, text, meta, scope:'interview'});
  persistConversation();
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'card interview-message';
  div.dataset.conversationScope = 'interview';
  div.innerHTML = `<div class="card-tag"><span class="dot"></span>${escHtml(label)}</div><div class="card-text"><strong>${escHtml(question.module_title || '访谈')}</strong><br>${escHtml(text)}</div>${question.context_hint ? `<div class="card-meta">${escHtml(question.context_hint)}</div>` : ''}`;
  output.appendChild(div);
  scrollOutput();
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  if (conversationMode === 'interview') div.dataset.conversationScope = 'interview';
  output.appendChild(div);
  conversationMessages.push({type:'user', text, scope: conversationMode === 'interview' ? 'interview' : 'analysis'});
  persistConversation();
  scrollOutput();
  inputText.value = '';
}

function addSectionTitle(text) {
  const div = document.createElement('div');
  div.className = 'section-title';
  div.textContent = text;
  output.appendChild(div);
  conversationMessages.push({type:'section', text});
  persistConversation();
  scrollOutput();
}

let cardCounter = 0;
function addCard(type, tag, text, meta, extra) {
  const div = document.createElement('div');
  div.className = `card ${type === 'obs' ? '' : type}`;
  div.style.animationDelay = `${(cardCounter++ % 8) * 50}ms`;
  if (conversationMode === 'interview') div.dataset.conversationScope = 'interview';
  div.innerHTML = `
    <div class="card-tag"><span class="dot"></span>${tag}</div>
    <div class="card-text">${escHtml(text)}</div>
    ${meta ? `<div class="card-meta">${meta}${extra ? ' / ' + extra : ''}</div>` : ''}
  `;
  output.appendChild(div);
  conversationMessages.push({type:'card', kind:type === 'obs' ? '' : type, tag, text, meta, scope: conversationMode === 'interview' ? 'interview' : 'analysis'});
  persistConversation();
  scrollOutput();
}

function showLoading(text) {
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading-indicator';
  div.innerHTML = `<span class="loading-dot"></span>${text}`;
  output.appendChild(div);
  scrollOutput();
}

function removeLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

function showPhaseBar() {
  const wrap = document.createElement('div');
  wrap.id = 'phase-indicator';
  wrap.innerHTML = `
    <div class="phase-label">
      <span class="active">PHASE 1</span><span>PHASE 2</span><span>PHASE 3</span><span>PHASE 4</span>
    </div>
    <div class="phase-bar">
      <div class="phase-step active"></div>
      <div class="phase-step"></div>
      <div class="phase-step"></div>
      <div class="phase-step"></div>
    </div>`;
  output.appendChild(wrap);
  scrollOutput();
  animatePhases();
}

function animatePhases() {
  const steps = document.querySelectorAll('#phase-indicator .phase-step');
  const labels = document.querySelectorAll('#phase-indicator .phase-label span');
  let phase = 0;
  const iv = setInterval(() => {
    if (phase >= 4) { clearInterval(iv); return; }
    steps.forEach((s, i) => {
      s.className = 'phase-step' + (i < phase ? ' done' : i === phase ? ' active' : '');
    });
    labels.forEach((l, i) => {
      l.className = (i < phase ? 'done' : i === phase ? 'active' : '');
    });
    phase++;
  }, 4000);
}

function removePhaseBar() {
  const el = document.getElementById('phase-indicator');
  if (el) el.remove();
}

function setBusy(busy) {
  document.getElementById('btn-analyze').disabled = busy;
  document.getElementById('btn-dialectical').disabled = busy;
}

function scrollOutput() { output.scrollTop = output.scrollHeight; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
async function apiErrorText(response, prefix) {
  let detail = `HTTP ${response.status}`;
  try {
    const body = await response.json();
    detail = body.detail || body.error?.message || detail;
  } catch {}
  return `${prefix}: ${detail}`;
}

// ── INTERVIEW ──
function interviewBody() { return {project_id: projectId, participant_id: participantId}; }
function interviewSetMessage(text, error = false) {
  const el = document.getElementById('interview-status');
  el.textContent = text;
  el.style.color = error ? 'var(--orange)' : 'var(--cyan)';
}
function connectionErrorMessage(error) {
  if (API && window.location.protocol === 'file:') {
    return `无法连接 API (${API})。请先启动 uvicorn scriptorium.api:app --host 127.0.0.1 --port 8000`;
  }
  return error?.message || '请求失败，请检查服务状态';
}
function renderInterview(payload) {
  const session = payload.session || payload;
  if (!session) return;
  interviewSession = session;
  interviewSessionId = session.id;
  localStorage.setItem('scriptorium_interview_session', interviewSessionId);
  const q = session.current_question;
  const progress = session.progress || {};
  interviewSetMessage(`状态: ${session.state} / 追问 ${progress.followups_used || 0}/${progress.followups_total || 0}`);
  document.getElementById('interview-progress').textContent =
    `主问题 ${progress.completed_primary || 0}/${progress.total_primary || 0} / 必答剩余 ${progress.required_remaining || 0}`;
  const moduleBar = document.getElementById('interview-modules');
  if (moduleBar) {
    const modules = progress.modules || [];
    const current = progress.current_module_id;
    const currentIndex = modules.findIndex(item => item.id === current);
    moduleBar.innerHTML = modules.map((item, index) => `<span class="interview-module-step ${item.id === current ? 'active' : index < currentIndex ? 'done' : ''}">${escHtml(item.title)}</span>`).join('');
  }
  const question = document.getElementById('interview-question');
  question.innerHTML = q ? `<div class="interview-module"><span>${escHtml(q.module_title || '访谈')}</span><span>${q.kind === 'followup' ? 'FOLLOW-UP / 澄清追问' : 'PRIMARY / 主问题'}</span></div>${q.context_hint ? `<div class="interview-context">${escHtml(q.context_hint)}</div>` : ''}<div class="question-kind">${q.kind === 'followup' ? '追问' : '主问题'}</div>${escHtml(q.text)}` : '<div class="no-data">访谈问题已完成，可以生成分析</div>';
  const active = session.state === 'CREATED' || session.state === 'IN_PROGRESS';
  document.getElementById('interview-start').disabled = active || session.state === 'COMPLETED' || session.state === 'WITHDRAWN';
  document.getElementById('interview-pause').disabled = !active;
  document.getElementById('interview-resume').disabled = session.state !== 'PAUSED';
  document.getElementById('interview-complete').disabled = session.state === 'COMPLETED' || session.state === 'WITHDRAWN';
  document.getElementById('interview-reset').disabled = false;
  document.getElementById('interview-withdraw').disabled = session.state === 'WITHDRAWN';
  const timeline = document.getElementById('interview-timeline');
  timeline.innerHTML = (session.turns || []).map((turn, index) => `<div class="interview-turn"><strong>${String(index + 1).padStart(2, '0')} / ${turn.kind === 'followup' ? '追问' : '主问题'}</strong>${escHtml(turn.answer_text)}</div>`).join('');
}
async function restoreInterview() {
  try {
    const r = await apiFetch(`${API}/api/v1/interviews/${encodeURIComponent(interviewSessionId)}?project_id=${encodeURIComponent(projectId)}&participant_id=${encodeURIComponent(participantId)}`);
    if (!r.ok) { localStorage.removeItem('scriptorium_interview_session'); interviewSessionId = ''; return; }
    renderInterview(await r.json());
  } catch {}
}
async function startInterview() {
  setConversationMode('interview');
  try {
    const r = await apiFetch(`${API}/api/v1/interviews`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(interviewBody())});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error?.message || `HTTP ${r.status}`);
    renderInterview(data.session);
    addInterviewQuestionMessage(data.session.current_question);
  } catch (e) { interviewSetMessage(`创建失败: ${connectionErrorMessage(e)}`, true); }
}
async function submitInterviewAnswer() {
  const answer = document.getElementById('input-text');
  if (!interviewSessionId || !interviewSession?.current_question || !answer.value.trim()) return;
  const questionId = interviewSession.current_question.id;
  const submittedText = answer.value.trim();
  addUserMsg(submittedText);
  try {
    const r = await apiFetch(`${API}/api/v1/interviews/${encodeURIComponent(interviewSessionId)}/turns`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...interviewBody(), question_id: questionId, answer_text: submittedText})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error?.message || `HTTP ${r.status}`);
    renderInterview(data);
    if (data.current_question) addInterviewQuestionMessage(data.current_question);
    else await completeInterview();
  } catch (e) { interviewSetMessage(`提交失败: ${e.message}`, true); }
}
async function interviewAction(action) {
  if (!interviewSessionId) return;
  try {
    const r = await apiFetch(`${API}/api/v1/interviews/${encodeURIComponent(interviewSessionId)}/${action}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(interviewBody())});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error?.message || `HTTP ${r.status}`);
    renderInterview(data);
  } catch (e) { interviewSetMessage(`${action} 失败: ${e.message}`, true); }
}
function pauseInterview() { interviewAction('pause'); }
function resumeInterview() { interviewAction('resume'); }
function withdrawInterview() { interviewAction('withdraw'); }
async function resetInterview() {
  if (!interviewSessionId) { await startInterview(); return; }
  if (!window.confirm('清零当前访谈并重新开始？已完成的材料和分析结果不会删除。')) return;
  try {
    const oldSessionId = interviewSessionId;
    const r = await apiFetch(`${API}/api/v1/interviews/${encodeURIComponent(oldSessionId)}/reset`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(interviewBody())});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error?.message || `HTTP ${r.status}`);
    clearInterviewMessages();
    renderInterview(data.session);
    setConversationMode('interview');
    addInterviewQuestionMessage(data.session.current_question);
  } catch (e) { interviewSetMessage(`清零失败: ${e.message}`, true); }
}
async function completeInterview() {
  if (!interviewSessionId) return;
  try {
    const r = await apiFetch(`${API}/api/v1/interviews/${encodeURIComponent(interviewSessionId)}/complete`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(interviewBody())});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error?.message || `HTTP ${r.status}`);
    renderInterview(data.session);
    addCard('synth', 'INTERVIEW COMPLETE', `材料已写入并开始分析 / source: ${data.source_id}`, `run: ${data.run_id}`);
    setConversationMode('analysis');
    await pollInterviewAnalysis(data.run_id);
  } catch (e) { interviewSetMessage(`完成失败: ${e.message}`, true); }
}
async function pollInterviewAnalysis(runId) {
  showLoading('ANALYZING INTERVIEW...');
  try {
    for (let tries = 0; tries < 60; tries++) {
      await sleep(1500);
      const r = await apiFetch(`${API}/api/v1/analysis-runs/${encodeURIComponent(runId)}`);
      const state = await r.json();
      if (state.state === 'APPROVED' || state.state === 'COMPILED') {
        const pr = await apiFetch(`${API}/api/v1/analysis-runs/${encodeURIComponent(runId)}/packet`);
        const packet = await pr.json();
        removeLoading();
        renderPacket(packet);
        return;
      }
      if (state.state === 'FAILED' || state.state === 'NEEDS_HUMAN_REVIEW') {
        removeLoading();
        if (state.state === 'NEEDS_HUMAN_REVIEW') {
          const pr = await apiFetch(`${API}/api/v1/analysis-runs/${encodeURIComponent(runId)}/packet`);
          renderPacket(await pr.json());
        } else {
          addCard('error', 'ERR', '访谈分析失败: ' + (state.errors || []).map(e => e.message || e).join('; '), `run: ${runId}`);
        }
        return;
      }
    }
    removeLoading();
    addCard('error', 'TIMEOUT', '访谈分析仍在后台运行，可稍后在结果区查看。', `run: ${runId}`);
  } catch (e) {
    removeLoading();
    addCard('error', 'ERR', `访谈分析请求失败: ${e.message}`, `run: ${runId}`);
  }
}
