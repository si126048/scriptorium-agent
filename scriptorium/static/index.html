<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium · 研究工作台前端未构建</title>
<style>
  :root { color-scheme: light dark; --paper: #f6f4ef; --ink: #24211c; --muted: #6b6459; --accent: #9a3b26; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1b18; --ink: #efe9de; --muted: #a79f92; --accent: #e0805f; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 ui-serif, "Songti SC", Georgia, serif; }
  main { max-width: 44rem; margin: 12vh auto; padding: 0 1.5rem; }
  .mark { font: 600 .8rem/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: .28em; color: var(--accent); text-transform: uppercase; }
  h1 { font-size: 2rem; font-weight: 500; margin: .4rem 0 1rem; }
  p { color: var(--muted); }
  pre { background: color-mix(in srgb, var(--ink) 6%, transparent); border-left: 2px solid var(--accent); padding: .8rem 1rem; overflow-x: auto; font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="mark">Scriptorium · Research Archive</p>
  <h1>前端资源尚未构建</h1>
  <p>研究工作台的静态文件没有安装。构建一次即可，之后访问本地址会直接进入工作台。</p>
  <pre>npm --prefix web ci
npm --prefix web run build</pre>
  <p>或者用 Docker 启动完整服务（单用户、无需 Node）：</p>
  <pre>docker compose -f compose.research.lite.yml --env-file .env.compose up -d --build</pre>
  <p>API 文档仍在 <a href="/docs">/docs</a>；本页只是构建前的占位。</p>
</main>
</body>
</html>
